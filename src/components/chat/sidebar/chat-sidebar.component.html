<div class="flex flex-col h-full bg-card">
    <!-- Header & Search -->
    <div class="p-3 border-b border-border space-y-3">
        <div class="flex items-center justify-between">
            <hlm-avatar>
                <img hlmAvatarImage src="/avatar.png" alt="@spartan-ui logo" class="grayscale" />
                <span hlmAvatarFallback>RG</span>
            </hlm-avatar>
            <div class="flex items-center gap-1">
                <img src="/logo.png" alt="Logo" class="h-8 w-auto object-contain" />
                <span class="font-bold text-lg text-zinc-400">LinkChain</span>
            </div>
            <div class="flex items-center gap-1">
                <button
                    class="inline-flex items-center justify-center size-8 rounded-full hover:bg-accent text-muted-foreground hover:text-foreground transition-colors shrink-0">
                    <ng-icon name="lucideSearch" class="text-lg"></ng-icon>
                </button>
                <button
                    class="inline-flex items-center justify-center size-8 rounded-full hover:bg-accent text-muted-foreground hover:text-foreground transition-colors shrink-0">
                    <ng-icon name="lucidePlus" class="text-lg"></ng-icon>
                </button>
            </div>
        </div>

        <!-- Filter Tabs -->
        <div class="flex items-center gap-1 text-xs overflow-x-auto no-scrollbar pb-1">
            <button
                class="flex items-center gap-2 px-3 py-1 rounded-full bg-red-600/20 text-white font-medium flex items-center gap-1 shrink-0">
                <span>All</span>
                <span class="text-[10px] bg-white/20 px-1.5 rounded-full">41</span>
            </button>
            <button
                class="px-3 py-1 rounded-full hover:bg-accent text-muted-foreground transition-colors shrink-0">Direct</button>
            <button
                class="px-3 py-1 rounded-full hover:bg-accent text-muted-foreground transition-colors shrink-0">Groups</button>
            <button
                class="px-3 py-1 rounded-full hover:bg-accent text-muted-foreground transition-colors shrink-0">Channels</button>
        </div>
    </div>

    <!-- Chat List -->
    <div class="flex-1 overflow-y-auto divide-y divide-border/50">
        @for (chat of chatService.conversations(); track chat.id) {
        <div (click)="chatService.setActiveConversation(chat.id)"
            [class.bg-red-50]="chatService.activeConversationId() === chat.id"
            [class.dark:bg-red-950/20]="chatService.activeConversationId() === chat.id"
            class="flex items-center gap-3 p-3 hover:bg-accent/60 cursor-pointer transition-colors">
            <!-- Avatar -->
            <hlm-avatar class="w-12 h-12 flex-shrink-0">
                <img *ngIf="chat.avatar" [src]="chat.avatar" hlmAvatarImage [alt]="chat.name" />
                <span hlmAvatarFallback class="bg-red-100 text-red-700 dark:bg-red-900 dark:text-red-200 font-bold">
                    {{ chat.name.charAt(0) }}
                </span>
            </hlm-avatar>

            <!-- Chat Info -->
            <div class="flex-1 min-w-0">
                <div class="flex justify-between items-baseline mb-1">
                    <h4 class="font-semibold text-sm truncate text-foreground">{{ chat.name }}</h4>
                    <span class="text-[11px] text-muted-foreground shrink-0">{{ chat.lastMessageTime }}</span>
                </div>

                <div class="flex justify-between items-center gap-2">
                    <p class="text-xs text-muted-foreground truncate">
                        {{ chat.lastMessage }}
                    </p>

                    @if (chat.unreadCount && chat.unreadCount > 0) {
                    <span hlmBadge
                        class="inline-flex items-center justify-center bg-red-600 hover:bg-red-600 text-white rounded-full text-[10px] leading-none min-w-[18px] h-[18px] px-1 shrink-0">
                        {{ chat.unreadCount }}
                    </span>

                    }
                </div>
            </div>
        </div>
        }
    </div>
</div>
